const rm=matchMedia("(prefers-reduced-motion: reduce)");
let last=null,hot=null;
function openSheet(n,el){
  const d=S[n];if(!d)return;last=el;
  stg.innerHTML=art(n);
  document.getElementById("st").textContent=d.t;
  const ss=document.getElementById("ss");ss.textContent=d.s;ss.hidden=!d.s;
  document.getElementById("sr").innerHTML=d.r.map(x=>`<div class="row"><span>${x[0]}</span><span>${x[1]}</span></div>`).join("");
  ov.hidden=false;document.body.style.overflow="hidden";
  requestAnimationFrame(()=>{ov.classList.add("on");document.getElementById("sx").focus()});
}
function closeSheet(){
  if(ov.hidden)return;
  ov.classList.remove("on");document.body.style.overflow="";
  setTimeout(()=>{ov.hidden=true},260);
  if(last)last.focus({preventScroll:true});
}
pl.addEventListener("click",e=>{const row=e.target.closest(".ph");if(row)openSheet(row.dataset.n,row)});

ov.addEventListener("click",e=>{if(e.target===ov)closeSheet()});
document.getElementById("sx").addEventListener("click",closeSheet);

// soft tilt: list thumbnails follow the mouse, the big phone follows mouse or finger
const reset=row=>{const v=row.querySelector(".th svg");if(v)v.style.transform=""};
pl.addEventListener("pointermove",e=>{
  if(e.pointerType!=="mouse"||rm.matches)return;
  const row=e.target.closest(".ph");
  if(hot&&hot!==row)reset(hot);
  if(!row){hot=null;return}
  hot=row;const v=row.querySelector(".th svg"),r=row.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  v.style.transform=`rotateX(${f(-y*16)}deg) rotateY(${f(x*30)}deg) scale(1.08)`;
});
pl.addEventListener("pointerleave",()=>{if(hot){reset(hot);hot=null}});
stg.addEventListener("pointermove",e=>{
  if(rm.matches)return;
  const v=stg.querySelector("svg");if(!v)return;
  const r=stg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  v.style.transform=`rotateX(${f(-y*26)}deg) rotateY(${f(x*40)}deg) scale(1.04)`;
});
["pointerleave","pointerup","pointercancel"].forEach(t=>stg.addEventListener(t,()=>{const v=stg.querySelector("svg");if(v)v.style.transform=""}));
