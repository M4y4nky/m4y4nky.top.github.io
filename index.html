*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}

.row{display:flex;justify-content:space-between;gap:24px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.row span:first-child{color:var(--dim);flex:none}
.row span:last-child{text-align:right}
.ph{display:flex;justify-content:flex-start;align-items:center;gap:16px;padding:10px 0;border-top:1px solid var(--line)}
.th{flex:none;width:58px;display:block}
.th svg{height:116px;width:auto;display:block;margin:0 auto}
.yg{break-inside:avoid;margin-top:30px}
.yg h4{font-size:14px;font-weight:500;color:var(--dim);margin-bottom:2px;font-variant-numeric:tabular-nums}
.ph.cur{font-weight:600;background:rgba(34,197,94,.09);border-radius:14px;border-top-color:transparent;padding:15px 16px;margin:8px -16px}
.ph.cur .y{color:var(--fg)}
#theme{position:absolute;top:14px;right:20px}
#theme{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--fg);cursor:pointer;display:grid;place-items:center;transition:border-color .2s}
#theme:hover{border-color:var(--ac);color:var(--ac)}
#theme:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#theme svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7}
.js .rv{opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .6s ease}
.js .rv.in{opacity:1;transform:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:9px;vertical-align:1px;box-shadow:0 0 0 4px rgba(34,197,94,.18)}
.row span,.ph{transition:color .2s}
@media(hover:hover){.row:hover span:first-child{color:var(--ac)}.ph:not(.cur):hover{color:var(--ac)}}
.note{display:block;padding-left:17px;font-weight:400;font-size:14px;color:var(--dim);margin-top:2px}
@media(min-width:760px){#theme{top:28px;right:40px}main{padding-top:96px}.row,.ph{font-size:16px}}
@media(min-width:1000px){main{max-width:1040px}#devs{display:grid;grid-template-columns:repeat(3,1fr);gap:48px;align-items:start}.dev{margin-top:28px}#phones{columns:2;column-gap:48px}}
@media print{#theme{display:none}main{max-width:none;padding:0;animation:none}.js .rv{opacity:1;transform:none}#devs{display:block}#phones{columns:2}:root{--bg:#fff;--fg:#111;--dim:#555;--line:#ccc;--ac:#111}}
@media(prefers-reduced-motion:reduce){body{transition:none}.js .rv{opacity:1;transform:none;transition:none}main{animation:none}html{scroll-behavior:auto}}
